<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loading...</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-image: url("https://raw.githubusercontent.com/gamerdad24/website/refs/heads/main/images/autism.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;

            font-family: Arial, Helvetica, sans-serif;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.10);
            pointer-events: none;
        }

        /*
         * The container holds the avatar AND its trail.
         */
        #avatarContainer {
            position: fixed;
            width: 128px;
            height: 128px;
            pointer-events: none;
        }

        #avatar {
            position: absolute;
            left: 0;
            top: 0;

            width: 128px;
            height: 128px;

            border-radius: 50%;
            object-fit: cover;

            border: 4px solid white;

            box-shadow:
                0 0 15px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(255, 255, 255, 0.35);

            user-select: none;
            pointer-events: none;

            display: none;
        }

        /*
         * Trail images.
         */
        .trail {
            position: fixed;

            width: 128px;
            height: 128px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid white;

            pointer-events: none;

            opacity: 0.35;

            filter: blur(1px);

            transform: scale(0.95);

            transition:
                opacity 0.5s ease-out,
                transform 0.5s ease-out;

            z-index: 1;
        }

        #avatarContainer {
            z-index: 2;
        }

        #loadingInfo {
            position: fixed;

            left: 50%;
            bottom: 25px;

            transform: translateX(-50%);

            padding: 10px 18px;

            background: rgba(0, 0, 0, 0.65);

            border-radius: 8px;

            color: white;

            font-size: 16px;
            font-weight: bold;

            text-align: center;

            text-shadow: 0 1px 3px black;

            white-space: nowrap;

            z-index: 10;
        }
    </style>
</head>

<body>

    <div id="overlay"></div>

    <div id="avatarContainer">
        <img id="avatar" src="" alt="Steam Avatar">
    </div>

    <div id="loadingInfo">
        Connecting...
    </div>


    <script>

        /*
         * ============================================================
         * CONFIGURATION
         * ============================================================
         */

        const AVATAR_SIZE = 128;

        const SPEED_X = 3.0;
        const SPEED_Y = 2.5;

        // How often a trail image is created.
        const TRAIL_INTERVAL = 45;

        // Maximum number of visible trail images.
        const MAX_TRAILS = 15;


        /*
         * ============================================================
         * VARIABLES
         * ============================================================
         */

        const avatar = document.getElementById("avatar");
        const avatarContainer =
            document.getElementById("avatarContainer");

        const loadingInfo =
            document.getElementById("loadingInfo");

        let x = 0;
        let y = 0;

        let velocityX = SPEED_X;
        let velocityY = SPEED_Y;

        let started = false;

        let frameCounter = 0;

        const trails = [];


        /*
         * ============================================================
         * CREATE TRAIL
         * ============================================================
         */

        function createTrail() {

            if (!avatar.src || avatar.style.display === "none") {
                return;
            }

            const trail = document.createElement("img");

            trail.className = "trail";

            trail.src = avatar.src;

            trail.style.left = x + "px";
            trail.style.top = y + "px";

            /*
             * Newer trails are more visible.
             */
            trail.style.opacity = "0.30";

            trail.style.transform = "scale(0.95)";

            document.body.appendChild(trail);

            trails.push(trail);

            /*
             * Animate the trail away.
             */
            requestAnimationFrame(() => {

                trail.style.opacity = "0";
                trail.style.transform = "scale(0.75)";

            });


            /*
             * Remove the oldest trails once we have too many.
             */
            while (trails.length > MAX_TRAILS) {

                const oldTrail = trails.shift();

                if (oldTrail && oldTrail.parentNode) {
                    oldTrail.parentNode.removeChild(oldTrail);
                }
            }


            /*
             * Remove this trail after the fade animation.
             */
            setTimeout(() => {

                if (trail.parentNode) {
                    trail.parentNode.removeChild(trail);
                }

                const index = trails.indexOf(trail);

                if (index !== -1) {
                    trails.splice(index, 1);
                }

            }, 600);
        }


        /*
         * ============================================================
         * SET STEAM AVATAR
         * ============================================================
         */

        function setSteamAvatar(steamID) {

            if (!steamID || steamID === "0") {
                return;
            }

            const avatarURL =
                "https://steamcommunity.com/profiles/"
                + encodeURIComponent(steamID)
                + "/avatarfull.jpg";

            avatar.src = avatarURL;

            avatar.onload = function () {

                avatar.style.display = "block";

                /*
                 * Start exactly in the center.
                 */
                x =
                    (window.innerWidth - AVATAR_SIZE) / 2;

                y =
                    (window.innerHeight - AVATAR_SIZE) / 2;

                avatarContainer.style.left = x + "px";
                avatarContainer.style.top = y + "px";

                if (!started) {

                    started = true;

                    requestAnimationFrame(moveAvatar);
                }
            };

            avatar.onerror = function () {

                avatar.style.display = "none";

                loadingInfo.innerText =
                    "Loading...";

            };
        }


        /*
         * ============================================================
         * DVD-STYLE MOVEMENT
         * ============================================================
         */

        function moveAvatar() {

            const maxX =
                window.innerWidth - AVATAR_SIZE;

            const maxY =
                window.innerHeight - AVATAR_SIZE;


            x += velocityX;
            y += velocityY;


            /*
             * Left / right collision.
             */
            if (x <= 0) {

                x = 0;

                velocityX =
                    Math.abs(velocityX);

            }
            else if (x >= maxX) {

                x = maxX;

                velocityX =
                    -Math.abs(velocityX);

            }


            /*
             * Top / bottom collision.
             */
            if (y <= 0) {

                y = 0;

                velocityY =
                    Math.abs(velocityY);

            }
            else if (y >= maxY) {

                y = maxY;

                velocityY =
                    -Math.abs(velocityY);

            }


            /*
             * Move avatar.
             */
            avatarContainer.style.left =
                x + "px";

            avatarContainer.style.top =
                y + "px";


            /*
             * Create trail periodically.
             */
            frameCounter++;

            if (frameCounter >= TRAIL_INTERVAL) {

                frameCounter = 0;

                createTrail();
            }


            requestAnimationFrame(moveAvatar);
        }


        /*
         * ============================================================
         * GARRY'S MOD GAMEDETAILS
         * ============================================================
         */

        window.GameDetails = function (
            servername,
            serverurl,
            mapname,
            maxplayers,
            steamid,
            gamemode,
            volume,
            language
        ) {

            console.log("Server:", servername);
            console.log("Map:", mapname);
            console.log("SteamID64:", steamid);
            console.log("Gamemode:", gamemode);

            loadingInfo.innerText =
                "Loading " + mapname + "...";

            setSteamAvatar(steamid);
        };


        /*
         * ============================================================
         * STATUS
         * ============================================================
         */

        window.SetStatusChanged = function (status) {

            if (status && status.length > 0) {

                loadingInfo.innerText =
                    status;
            }
        };


        /*
         * ============================================================
         * DOWNLOAD STATUS
         * ============================================================
         */

        window.DownloadingFile = function (file) {

            if (file) {

                loadingInfo.innerText =
                    "Downloading: " + file;
            }
        };


        /*
         * ============================================================
         * RESIZE
         * ============================================================
         */

        window.addEventListener("resize", function () {

            const maxX =
                window.innerWidth - AVATAR_SIZE;

            const maxY =
                window.innerHeight - AVATAR_SIZE;

            x = Math.max(
                0,
                Math.min(x, maxX)
            );

            y = Math.max(
                0,
                Math.min(y, maxY)
            );

        });

    </script>

</body>
</html>
