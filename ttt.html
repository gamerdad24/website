<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Garry's Mod Loading Screen</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background: #111;
        color: #fff;
    }

    body {
        position: relative;

        background-image:
            linear-gradient(
                rgba(0, 0, 0, 0.45),
                rgba(0, 0, 0, 0.65)
            ),
            url("https://raw.githubusercontent.com/gamerdad24/website/refs/heads/main/images/autism.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* =========================================================
       INFORMATION
       ========================================================= */

    #leftSide {
        position: fixed;

        left: 45px;
        top: 50%;

        transform:
            translateY(-50%);

        width: 420px;

        z-index: 20;
    }

    .section {
        margin-bottom: 24px;
    }

    .label {
        margin-bottom: 5px;

        font-size: 12px;
        font-weight: 600;

        color:
            rgba(255,255,255,0.55);

        text-transform: uppercase;
        letter-spacing: 2px;
    }

    #steamName {
        font-size: 30px;
        font-weight: 600;

        color: white;
    }

    #serverName {
        font-size: 26px;
        font-weight: 600;

        color: white;
    }

    #mapName {
        margin-top: 6px;

        font-size: 15px;

        color:
            rgba(255,255,255,0.65);
    }

    #status {
        min-height: 22px;

        font-size: 15px;

        color:
            rgba(255,255,255,0.75);
    }

    /* =========================================================
       PROGRESS BAR
       ========================================================= */

    #loadingBar {
        width: 100%;
        height: 4px;

        margin-top: 12px;

        overflow: hidden;

        background:
            rgba(255,255,255,0.18);

        border-radius: 4px;
    }

    #loadingProgress {
        width: 0%;
        height: 100%;

        background: white;

        border-radius: 4px;

        transition:
            width 0.25s ease;
    }

    /* =========================================================
       EASTER EGG TEXT
       ========================================================= */

    #eggMessage {
        min-height: 20px;

        font-size: 13px;

        color:
            rgba(255,255,255,0.45);

        transition:
            opacity 0.3s ease;
    }

    /* =========================================================
       PLAYER AVATAR
       ========================================================= */

    #avatar {
        position: fixed;

        width: 128px;
        height: 128px;

        z-index: 10;

        pointer-events: none;

        transform-origin:
            center center;
    }

    #avatarImage {
        width: 128px;
        height: 128px;

        display: block;

        object-fit: cover;

        border-radius: 50%;

        border: 3px solid
            rgba(255,255,255,0.9);

        box-shadow:
            0 8px 30px
            rgba(0,0,0,0.55);

        animation:
            subtlePulse 2s
            ease-in-out
            infinite;
    }

    /* =========================================================
       ENEMY
       ========================================================= */

    #enemy {
        position: fixed;

        width: 110px;
        height: 110px;

        z-index: 9;

        pointer-events: none;

        transform-origin:
            center center;
    }

    #enemyImage {
        width: 110px;
        height: 110px;

        display: block;

        object-fit: cover;

        border-radius: 50%;

        border: 3px solid
            rgba(255,255,255,0.9);

        box-shadow:
            0 8px 30px
            rgba(0,0,0,0.65);
    }

    /* =========================================================
       COLLISION PARTICLES
       ========================================================= */

    .explosionParticle {
        position: fixed;

        width: 7px;
        height: 7px;

        border-radius: 50%;

        pointer-events: none;

        z-index: 30;

        background: #fff;

        box-shadow:
            0 0 8px
            rgba(255,255,255,0.9);

        transform:
            translate(-50%, -50%);

        will-change:
            transform,
            opacity;
    }

    .explosionFlash {
        position: fixed;

        width: 18px;
        height: 18px;

        border-radius: 50%;

        pointer-events: none;

        z-index: 29;

        background:
            rgba(255,255,255,0.9);

        box-shadow:
            0 0 25px
            rgba(255,255,255,0.8);

        transform:
            translate(-50%, -50%)
            scale(0.5);

        animation:
            flashAnimation
            0.25s
            ease-out
            forwards;
    }

    @keyframes flashAnimation {

        0% {
            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(0.5);
        }

        100% {
            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(4);
        }
    }

    /* =========================================================
       SIMPLE EDGE IMPACT
       ========================================================= */

    .impact {
        position: fixed;

        width: 8px;
        height: 8px;

        border-radius: 50%;

        pointer-events: none;

        z-index: 4;

        background:
            rgba(255,255,255,0.8);

        transform:
            translate(-50%, -50%);

        animation:
            impactAnim
            0.35s
            ease-out
            forwards;
    }

    @keyframes impactAnim {

        0% {
            opacity: 0.8;

            width: 8px;
            height: 8px;
        }

        100% {
            opacity: 0;

            width: 45px;
            height: 45px;
        }
    }

    /* =========================================================
       DEMO BADGE
       ========================================================= */

    #demoBadge {
        display: none;

        position: fixed;

        right: 25px;
        top: 25px;

        z-index: 40;

        padding: 7px 11px;

        border: 1px solid
            rgba(255,255,255,0.3);

        border-radius: 4px;

        background:
            rgba(0,0,0,0.45);

        color:
            rgba(255,255,255,0.65);

        font-size: 11px;

        letter-spacing: 1px;
        text-transform: uppercase;
    }

    /* =========================================================
       ANIMATIONS
       ========================================================= */

    @keyframes subtlePulse {

        0%,
        100% {
            transform:
                scale(1);
        }

        50% {
            transform:
                scale(1.015);
        }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

        #leftSide {
            left: 25px;
            right: 25px;
            bottom: 25px;
            top: auto;

            width: auto;

            transform: none;
        }

        #steamName {
            font-size: 24px;
        }

        #serverName {
            font-size: 22px;
        }

        #avatar {
            width: 96px;
            height: 96px;
        }

        #avatarImage {
            width: 96px;
            height: 96px;
        }

        #enemy {
            width: 84px;
            height: 84px;
        }

        #enemyImage {
            width: 84px;
            height: 84px;
        }
    }
</style>
</head>

<body>

<!-- =========================================================
     INFORMATION
     ========================================================= -->

<div id="leftSide">

    <div class="section">

        <div class="label">
            Player
        </div>

        <div id="steamName">
            GMod Player
        </div>

    </div>


    <div class="section">

        <div class="label">
            Server
        </div>

        <div id="serverName">
            Garry's Mod Server
        </div>

        <div id="mapName">
            MAP: gm_construct
        </div>

    </div>


    <div class="section">

        <div id="status">
            Waiting for the server...
        </div>

        <div id="loadingBar">
            <div id="loadingProgress"></div>
        </div>

    </div>


    <div id="eggMessage">
        Loading...
    </div>

</div>


<!-- =========================================================
     DEMO MODE
     ========================================================= -->

<div id="demoBadge">
    Demo Mode
</div>


<!-- =========================================================
     PLAYER AVATAR
     ========================================================= -->

<div id="avatar">

    <img
        id="avatarImage"
        alt="Steam Avatar"
    >

</div>


<!-- =========================================================
     ENEMY
     ========================================================= -->

<div id="enemy">

    <img
        id="enemyImage"
        alt="Enemy"
        src="https://i.pinimg.com/736x/9a/2d/fc/9a2dfce91444f5777adf91953ba36ed7.jpg"
    >

</div>


<script>

/* ============================================================
   CONFIG
   ============================================================ */

const FORCE_DEMO_MODE = false;


/* Player */

const AVATAR_SIZE = 128;

const MIN_SPEED = 1.5;
const MAX_SPEED = 5.5;


/* Enemy */

const ENEMY_SIZE = 110;

const ENEMY_MIN_SPEED = 1.7;
const ENEMY_MAX_SPEED = 5.0;


/* Particle explosion */

const EXPLOSION_PARTICLES = 28;


/* ============================================================
   STATE
   ============================================================ */

let gotGameDetails = false;

let progress = 0;


/* Player position */

let posX =
    window.innerWidth / 2 -
    AVATAR_SIZE / 2;

let posY =
    window.innerHeight / 2 -
    AVATAR_SIZE / 2;


/* Player velocity */

let vx =
    randomDirection() *
    randomRange(
        MIN_SPEED,
        MAX_SPEED
    );

let vy =
    randomDirection() *
    randomRange(
        MIN_SPEED,
        MAX_SPEED
    );


/* Enemy position */

let enemyX =
    window.innerWidth * 0.72;

let enemyY =
    window.innerHeight * 0.30;


/* Enemy velocity */

let enemyVX =
    randomDirection() *
    randomRange(
        ENEMY_MIN_SPEED,
        ENEMY_MAX_SPEED
    );

let enemyVY =
    randomDirection() *
    randomRange(
        ENEMY_MIN_SPEED,
        ENEMY_MAX_SPEED
    );


/*
    Prevent repeated collision explosions
    while the objects are overlapping.
*/

let collisionCooldown = 0;


/* ============================================================
   ELEMENTS
   ============================================================ */

const avatar =
    document.getElementById(
        "avatar"
    );

const avatarImage =
    document.getElementById(
        "avatarImage"
    );

const enemy =
    document.getElementById(
        "enemy"
    );

const steamName =
    document.getElementById(
        "steamName"
    );

const serverName =
    document.getElementById(
        "serverName"
    );

const mapName =
    document.getElementById(
        "mapName"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const progressElement =
    document.getElementById(
        "loadingProgress"
    );

const eggMessage =
    document.getElementById(
        "eggMessage"
    );

const demoBadge =
    document.getElementById(
        "demoBadge"
    );


/* ============================================================
   HELPERS
   ============================================================ */

function randomRange(
    min,
    max
) {

    return Math.random() *
        (max - min) +
        min;
}


function randomDirection() {

    return Math.random() < 0.5
        ? -1
        : 1;
}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}


/* ============================================================
   DUMMY AVATAR
   ============================================================ */

function createDummyAvatar() {

    const svg = `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="256"
            height="256"
        >

            <rect
                width="256"
                height="256"
                fill="#555"
            />

            <circle
                cx="128"
                cy="104"
                r="58"
                fill="#ddd"
            />

            <circle
                cx="102"
                cy="100"
                r="9"
                fill="#222"
            />

            <circle
                cx="154"
                cy="100"
                r="9"
                fill="#222"
            />

            <path
                d="M85 135 Q128 170 171 135"
                stroke="#222"
                stroke-width="10"
                fill="none"
                stroke-linecap="round"
            />

        </svg>
    `;

    return "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);
}


/* ============================================================
   PLAYER AVATAR
   ============================================================ */

function setDummyAvatar() {

    avatarImage.src =
        createDummyAvatar();
}


function setRealSteamAvatar(
    steamID
) {

    if (!steamID) {

        setDummyAvatar();

        return;
    }

    const url =
        "https://steamcommunity.com/profiles/" +
        steamID +
        "/avatarfull.jpg";

    avatarImage.onload =
        function() {

            avatarImage.style.display =
                "block";
        };

    avatarImage.onerror =
        function() {

            setDummyAvatar();
        };

    avatarImage.src =
        url;
}


/* ============================================================
   STEAM NAME
   ============================================================ */

async function getSteamName(
    steamID
) {

    if (!steamID) {

        steamName.textContent =
            "GMod Player";

        return;
    }

    try {

        const response =
            await fetch(
                "https://steamcommunity.com/profiles/" +
                steamID +
                "?xml=1"
            );

        if (!response.ok) {

            throw new Error(
                "Steam request failed"
            );
        }

        const text =
            await response.text();

        const match =
            text.match(
                /<steamID><!\[CDATA\[(.*?)\]\]><\/steamID>/
            );

        if (
            match &&
            match[1]
        ) {

            steamName.textContent =
                match[1];

        } else {

            steamName.textContent =
                "GMod Player";
        }

    } catch (error) {

        steamName.textContent =
            "GMod Player";
    }
}


/* ============================================================
   DEMO MODE
   ============================================================ */

function startDemoMode() {

    if (
        gotGameDetails &&
        !FORCE_DEMO_MODE
    ) {

        return;
    }

    demoBadge.style.display =
        "block";

    steamName.textContent =
        "GMod Player";

    serverName.textContent =
        "Example GMod Server";

    mapName.textContent =
        "MAP: gm_construct";

    statusElement.textContent =
        "Demo mode — pretending to load...";

    setDummyAvatar();

    setProgress(45);
}


/* ============================================================
   GAMEMODE API
   ============================================================ */

window.GameDetails =
function(
    servername,
    serverurl,
    gamemap,
    maxplayers,
    steamid,
    gamemode,
    volume,
    language
) {

    gotGameDetails = true;

    demoBadge.style.display =
        "none";

    steamName.textContent =
        "GMod Player";

    serverName.textContent =
        servername ||
        "Garry's Mod Server";

    mapName.textContent =
        "MAP: " +
        (
            gamemap ||
            "unknown"
        );

    setRealSteamAvatar(
        steamid
    );

    getSteamName(
        steamid
    );

    statusElement.textContent =
        "Getting things ready...";

    setProgress(5);
};


/* ============================================================
   STATUS API
   ============================================================ */

window.SetStatusChanged =
function(statusText) {

    statusElement.textContent =
        statusText ||
        "Loading...";

    progress +=
        randomRange(
            3,
            10
        );

    setProgress(
        progress
    );
};


/* ============================================================
   DOWNLOAD API
   ============================================================ */

window.DownloadingFile =
function(file) {

    statusElement.textContent =
        "Downloading: " +
        (
            file ||
            "file"
        );

    progress +=
        randomRange(
            0.5,
            3
        );

    setProgress(
        progress
    );
};


function setProgress(value) {

    progress =
        clamp(
            value,
            0,
            100
        );

    progressElement.style.width =
        progress + "%";
}


/* ============================================================
   SIMPLE EASTER-EGG TEXT
   ============================================================ */

const messages = [

    "Loading...",

    "Getting things ready...",

    "Loading game files...",

    "Checking server connection...",

    "Preparing the map...",

    "Loading addons...",

    "Almost there...",

    "Please wait...",

    "Connecting...",

    "Starting server session..."

];

let messageIndex = 0;


function nextMessage() {

    eggMessage.style.opacity =
        "0";

    setTimeout(
        () => {

            eggMessage.textContent =
                messages[
                    messageIndex
                ];

            messageIndex =
                (
                    messageIndex + 1
                ) %
                messages.length;

            eggMessage.style.opacity =
                "1";

        },
        300
    );
}


setInterval(
    nextMessage,
    4000
);


/* ============================================================
   SIMPLE EDGE IMPACT
   ============================================================ */

function createImpact(
    x,
    y
) {

    const impact =
        document.createElement(
            "div"
        );

    impact.className =
        "impact";

    impact.style.left =
        x + "px";

    impact.style.top =
        y + "px";

    document.body.appendChild(
        impact
    );

    setTimeout(
        () => {

            if (
                impact.parentNode
            ) {

                impact.parentNode
                    .removeChild(
                        impact
                    );
            }

        },
        400
    );
}


/* ============================================================
   PARTICLE EXPLOSION
   ============================================================ */

function createExplosion(
    centerX,
    centerY
) {

    /*
        Small central flash.
    */

    const flash =
        document.createElement(
            "div"
        );

    flash.className =
        "explosionFlash";

    flash.style.left =
        centerX + "px";

    flash.style.top =
        centerY + "px";

    document.body.appendChild(
        flash
    );

    setTimeout(
        () => {

            if (
                flash.parentNode
            ) {

                flash.parentNode
                    .removeChild(
                        flash
                    );
            }

        },
        300
    );


    /*
        Create individual particles.
    */

    for (
        let i = 0;
        i < EXPLOSION_PARTICLES;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "explosionParticle";


        /*
            Random direction.
        */

        const angle =
            Math.random() *
            Math.PI *
            2;


        /*
            Random initial speed.
        */

        let velocity =
            randomRange(
                3,
                10
            );

        let velocityX =
            Math.cos(angle) *
            velocity;

        let velocityY =
            Math.sin(angle) *
            velocity;


        /*
            Slightly different particle
            sizes.
        */

        const size =
            randomRange(
                3,
                8
            );

        particle.style.width =
            size + "px";

        particle.style.height =
            size + "px";


        particle.style.left =
            centerX + "px";

        particle.style.top =
            centerY + "px";


        document.body.appendChild(
            particle
        );


        let x = centerX;
        let y = centerY;

        let life =
            randomRange(
                35,
                65
            );

        let gravity =
            0.16;


        function animateParticle() {

            x += velocityX;
            y += velocityY;

            velocityY += gravity;

            velocityX *= 0.985;
            velocityY *= 0.985;

            life--;


            particle.style.left =
                x + "px";

            particle.style.top =
                y + "px";


            const opacity =
                Math.max(
                    0,
                    life / 65
                );

            particle.style.opacity =
                opacity;


            particle.style.transform =
                "translate(-50%, -50%)";


            if (
                life > 0
            ) {

                requestAnimationFrame(
                    animateParticle
                );

            } else {

                if (
                    particle.parentNode
                ) {

                    particle.parentNode
                        .removeChild(
                            particle
                        );
                }
            }
        }


        requestAnimationFrame(
            animateParticle
        );
    }
}


/* ============================================================
   PLAYER DIRECTION
   ============================================================ */

function changeDirection(
    horizontal,
    direction
) {

    const speed =
        randomRange(
            MIN_SPEED,
            MAX_SPEED
        );

    const variation =
        randomRange(
            -0.4,
            0.4
        );

    if (
        horizontal
    ) {

        vx =
            direction *
            speed;

        vy +=
            variation;

    } else {

        vy =
            direction *
            speed;

        vx +=
            variation;
    }
}


/* ============================================================
   ENEMY DIRECTION
   ============================================================ */

function changeEnemyDirection(
    horizontal,
    direction
) {

    const speed =
        randomRange(
            ENEMY_MIN_SPEED,
            ENEMY_MAX_SPEED
        );

    const variation =
        randomRange(
            -0.4,
            0.4
        );

    if (
        horizontal
    ) {

        enemyVX =
            direction *
            speed;

        enemyVY +=
            variation;

    } else {

        enemyVY =
            direction *
            speed;

        enemyVX +=
            variation;
    }
}


/* ============================================================
   COLLISION CHECK
   ============================================================ */

function checkPlayerEnemyCollision() {

    if (
        collisionCooldown > 0
    ) {

        return;
    }


    const playerCenterX =
        posX +
        AVATAR_SIZE / 2;

    const playerCenterY =
        posY +
        AVATAR_SIZE / 2;


    const enemyCenterX =
        enemyX +
        ENEMY_SIZE / 2;

    const enemyCenterY =
        enemyY +
        ENEMY_SIZE / 2;


    const dx =
        playerCenterX -
        enemyCenterX;

    const dy =
        playerCenterY -
        enemyCenterY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const collisionDistance =
        AVATAR_SIZE / 2 +
        ENEMY_SIZE / 2;


    if (
        distance <=
        collisionDistance
    ) {

        /*
            Explosion occurs exactly
            between the two objects.
        */

        const explosionX =
            (
                playerCenterX +
                enemyCenterX
            ) / 2;

        const explosionY =
            (
                playerCenterY +
                enemyCenterY
            ) / 2;


        createExplosion(
            explosionX,
            explosionY
        );


        /*
            Push the objects apart.
        */

        let normalX = dx;
        let normalY = dy;


        const length =
            Math.sqrt(
                normalX * normalX +
                normalY * normalY
            );


        if (
            length > 0
        ) {

            normalX /= length;
            normalY /= length;

        } else {

            normalX = 1;
            normalY = 0;
        }


        const push = 8;


        posX +=
            normalX * push;

        posY +=
            normalY * push;


        enemyX -=
            normalX * push;

        enemyY -=
            normalY * push;


        /*
            Bounce both objects away
            from each other.
        */

        vx =
            -vx *
            randomRange(
                0.9,
                1.1
            );

        vy =
            -vy *
            randomRange(
                0.9,
                1.1
            );


        enemyVX =
            -enemyVX *
            randomRange(
                0.9,
                1.1
            );

        enemyVY =
            -enemyVY *
            randomRange(
                0.9,
                1.1
            );


        /*
            Brief cooldown prevents the
            same collision from generating
            dozens of explosions.
        */

        collisionCooldown = 35;
    }
}


/* ============================================================
   PLAYER MOVEMENT
   ============================================================ */

function updatePlayer() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    posX += vx;
    posY += vy;


    /* Left */

    if (
        posX <= 0
    ) {

        posX = 0;

        vx =
            Math.abs(vx);

        changeDirection(
            true,
            1
        );

        createImpact(
            0,
            posY +
            AVATAR_SIZE / 2
        );
    }


    /* Right */

    if (
        posX +
        AVATAR_SIZE >=
        width
    ) {

        posX =
            width -
            AVATAR_SIZE;

        vx =
            -Math.abs(vx);

        changeDirection(
            true,
            -1
        );

        createImpact(
            width,
            posY +
            AVATAR_SIZE / 2
        );
    }


    /* Top */

    if (
        posY <= 0
    ) {

        posY = 0;

        vy =
            Math.abs(vy);

        changeDirection(
            false,
            1
        );

        createImpact(
            posX +
            AVATAR_SIZE / 2,
            0
        );
    }


    /* Bottom */

    if (
        posY +
        AVATAR_SIZE >=
        height
    ) {

        posY =
            height -
            AVATAR_SIZE;

        vy =
            -Math.abs(vy);

        changeDirection(
            false,
            -1
        );

        createImpact(
            posX +
            AVATAR_SIZE / 2,
            height
        );
    }


    avatar.style.left =
        posX + "px";

    avatar.style.top =
        posY + "px";
}


/* ============================================================
   ENEMY MOVEMENT
   ============================================================ */

function updateEnemy() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    enemyX += enemyVX;
    enemyY += enemyVY;


    /* Left */

    if (
        enemyX <= 0
    ) {

        enemyX = 0;

        enemyVX =
            Math.abs(enemyVX);

        changeEnemyDirection(
            true,
            1
        );

        createImpact(
            0,
            enemyY +
            ENEMY_SIZE / 2
        );
    }


    /* Right */

    if (
        enemyX +
        ENEMY_SIZE >=
        width
    ) {

        enemyX =
            width -
            ENEMY_SIZE;

        enemyVX =
            -Math.abs(enemyVX);

        changeEnemyDirection(
            true,
            -1
        );

        createImpact(
            width,
            enemyY +
            ENEMY_SIZE / 2
        );
    }


    /* Top */

    if (
        enemyY <= 0
    ) {

        enemyY = 0;

        enemyVY =
            Math.abs(enemyVY);

        changeEnemyDirection(
            false,
            1
        );

        createImpact(
            enemyX +
            ENEMY_SIZE / 2,
            0
        );
    }


    /* Bottom */

    if (
        enemyY +
        ENEMY_SIZE >=
        height
    ) {

        enemyY =
            height -
            ENEMY_SIZE;

        enemyVY =
            -Math.abs(enemyVY);

        changeEnemyDirection(
            false,
            -1
        );

        createImpact(
            enemyX +
            ENEMY_SIZE / 2,
            height
        );
    }


    enemy.style.left =
        enemyX + "px";

    enemy.style.top =
        enemyY + "px";
}


/* ============================================================
   MAIN ANIMATION
   ============================================================ */

function animate() {

    updatePlayer();

    updateEnemy();

    checkPlayerEnemyCollision();


    if (
        collisionCooldown > 0
    ) {

        collisionCooldown--;
    }


    requestAnimationFrame(
        animate
    );
}


/* ============================================================
   RESIZE
   ============================================================ */

window.addEventListener(
    "resize",
    () => {

        posX =
            clamp(
                posX,
                0,
                window.innerWidth -
                AVATAR_SIZE
            );

        posY =
            clamp(
                posY,
                0,
                window.innerHeight -
                AVATAR_SIZE
            );


        enemyX =
            clamp(
                enemyX,
                0,
                window.innerWidth -
                ENEMY_SIZE
            );

        enemyY =
            clamp(
                enemyY,
                0,
                window.innerHeight -
                ENEMY_SIZE
            );
    }
);


/* ============================================================
   START
   ============================================================ */

setDummyAvatar();

setProgress(0);

animate();


/*
    Automatically use demo mode when
    opened directly in a browser.
*/

setTimeout(
    () => {

        if (
            !gotGameDetails ||
            FORCE_DEMO_MODE
        ) {

            startDemoMode();
        }

    },
    1000
);

</script>

</body>
