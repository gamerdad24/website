<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trouble in Autism Town</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        background: #111;
    }

    body {
        position: relative;
        color: white;
        background-image:
            linear-gradient(
                rgba(0, 0, 0, 0.18),
                rgba(0, 0, 0, 0.38)
            ),
            url("https://raw.githubusercontent.com/gamerdad24/website/refs/heads/main/images/autism.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* =========================================================
       COLORFUL OVERLAYS
       ========================================================= */

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at 15% 20%, rgba(255, 0, 110, 0.12), transparent 25%),
            radial-gradient(circle at 85% 25%, rgba(0, 245, 255, 0.12), transparent 25%),
            radial-gradient(circle at 50% 90%, rgba(124, 255, 0, 0.10), transparent 30%);
        z-index: 1;
    }

    /* CRT scanlines */
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        background: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.025) 0px,
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 4px
        );
        mix-blend-mode: overlay;
    }

    /* =========================================================
       LEFT UI
       ========================================================= */

    #leftSide {
        position: fixed;
        left: 35px;
        top: 50%;
        transform: translateY(-50%);
        width: min(430px, calc(100vw - 70px));
        z-index: 20;
    }

    .card {
        position: relative;
        margin-bottom: 16px;
        padding: 18px 22px;
        border: 4px solid white;
        border-radius: 24px;
        background:
            linear-gradient(
                135deg,
                rgba(255, 0, 110, 0.82),
                rgba(168, 85, 247, 0.78),
                rgba(0, 245, 255, 0.75)
            );
        box-shadow:
            0 0 0 4px #111,
            0 0 25px rgba(255,255,255,0.3),
            8px 8px 0 rgba(0,0,0,0.35);
        transform: rotate(-1deg);
    }

    .card:nth-child(even) {
        transform: rotate(1deg);
    }

    .card::before {
        content: "★";
        position: absolute;
        top: -20px;
        right: 18px;
        color: #ffea00;
        font-size: 30px;
        text-shadow: 3px 3px 0 #111;
        animation: wiggle 1.4s infinite ease-in-out;
    }

    #welcome {
        font-size: 20px;
        font-weight: bold;
        text-shadow: 3px 3px 0 #111;
        margin-bottom: 2px;
    }

    #steamName {
        font-size: 30px;
        line-height: 1.05;
        font-weight: bold;
        color: #fff;
        text-shadow:
            3px 3px 0 #ff006e,
            5px 5px 0 #111;
        overflow-wrap: anywhere;
    }

    #community {
        margin-top: 5px;
        font-size: 15px;
        font-weight: bold;
        color: #ffea00;
        text-shadow: 2px 2px 0 #111;
    }

    #serverName {
        font-size: 27px;
        line-height: 1.05;
        font-weight: bold;
        color: #fff;
        text-shadow:
            3px 3px 0 #00f5ff,
            5px 5px 0 #111;
    }

    #gameMode {
        margin-top: 7px;
        font-size: 17px;
        font-weight: bold;
        color: #ffea00;
        text-shadow: 2px 2px 0 #111;
    }

    #mapName {
        margin-top: 5px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        text-shadow: 2px 2px 0 #111;
    }

    #status {
        font-size: 21px;
        font-weight: bold;
        min-height: 28px;
        text-shadow: 2px 2px 0 #111;
    }

    #loadingBar {
        position: relative;
        width: 100%;
        height: 18px;
        margin-top: 12px;
        border: 3px solid white;
        border-radius: 20px;
        background: rgba(0,0,0,0.55);
        overflow: hidden;
        box-shadow: 3px 3px 0 #111;
    }

    #loadingProgress {
        width: 0%;
        height: 100%;
        border-radius: 20px;
        background:
            linear-gradient(
                90deg,
                #ff006e,
                #ffea00,
                #7cff00,
                #00f5ff,
                #a855f7
            );
        background-size: 300% 100%;
        animation: rainbowBar 1.5s linear infinite;
        transition: width 0.25s ease;
    }

    #eggMessage {
        min-height: 28px;
        font-size: 18px;
        font-weight: bold;
        color: #fff;
        text-shadow: 2px 2px 0 #111;
        transition: opacity 0.25s ease;
    }

    /* =========================================================
       TOP LEFT COMMUNITY BADGE
       ========================================================= */

    #communityBadge {
        position: fixed;
        left: 30px;
        top: 25px;
        z-index: 30;
        padding: 10px 17px;
        border: 3px solid white;
        border-radius: 18px;
        background: #ff006e;
        box-shadow:
            4px 4px 0 #111,
            0 0 18px rgba(255,0,110,0.6);
        font-size: 16px;
        font-weight: bold;
        text-shadow: 2px 2px 0 #111;
        transform: rotate(-2deg);
    }

    #demoBadge {
        display: none;
        position: fixed;
        right: 25px;
        top: 25px;
        z-index: 30;
        padding: 9px 14px;
        border: 3px solid white;
        border-radius: 15px;
        background: #7cff00;
        color: #111;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 4px 4px 0 #111;
    }

    /* =========================================================
       BOUNCING STEAM AVATAR
       ========================================================= */

    #avatar {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 128px;
        height: 128px;
        z-index: 15;
        pointer-events: none;
        transform-origin: center center;
    }

    #avatarImage {
        position: absolute;
        inset: 0;
        width: 128px;
        height: 128px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid white;

        box-shadow:
            0 0 10px #ff006e,
            0 0 20px #00f5ff,
            0 0 30px #7cff00,
            0 0 45px rgba(168,85,247,0.8);

        animation: avatarPulse 1.2s infinite ease-in-out;
    }

    /* =========================================================
       RGB TRAIL
       ========================================================= */

    .trail {
        position: fixed;
        width: 105px;
        height: 105px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 8;
        opacity: 0;
        transform: translate(-50%, -50%);
        mix-blend-mode: screen;
        filter: blur(2px);
    }

    .trail.red {
        background: rgba(255,0,70,0.45);
        box-shadow: 0 0 25px rgba(255,0,70,0.8);
    }

    .trail.green {
        background: rgba(80,255,0,0.35);
        box-shadow: 0 0 25px rgba(80,255,0,0.8);
    }

    .trail.blue {
        background: rgba(0,180,255,0.4);
        box-shadow: 0 0 25px rgba(0,180,255,0.8);
    }

    .trail.yellow {
        background: rgba(255,230,0,0.3);
        box-shadow: 0 0 25px rgba(255,230,0,0.8);
    }

    /* =========================================================
       EDGE IMPACTS
       ========================================================= */

    .impact {
        position: fixed;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 12;
        border: 4px solid white;
        transform: translate(-50%, -50%);
        animation: impactAnim 0.45s ease-out forwards;
    }

    /* =========================================================
       CORNER STARS
       ========================================================= */

    .star {
        position: fixed;
        pointer-events: none;
        z-index: 25;
        font-weight: bold;
        line-height: 1;
        text-shadow:
            0 0 5px currentColor,
            2px 2px 0 #111;
        transform-origin: center;
    }

    /* =========================================================
       GLITCH
       ========================================================= */

    #glitch {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0;
        background:
            repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 4px,
                rgba(255,0,110,0.07) 4px,
                rgba(255,0,110,0.07) 7px
            );
    }

    /* =========================================================
       ANIMATIONS
       ========================================================= */

    @keyframes rainbowBar {
        from {
            background-position: 0% 0%;
        }
        to {
            background-position: 300% 0%;
        }
    }

    @keyframes avatarPulse {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.035);
        }
    }

    @keyframes wiggle {
        0%, 100% {
            transform: rotate(-10deg) scale(1);
        }
        50% {
            transform: rotate(12deg) scale(1.15);
        }
    }

    @keyframes impactAnim {
        0% {
            opacity: 1;
            width: 15px;
            height: 15px;
            box-shadow: 0 0 5px white;
        }

        100% {
            opacity: 0;
            width: 100px;
            height: 100px;
            box-shadow:
                0 0 30px #ff006e,
                0 0 50px #00f5ff;
        }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {
        #leftSide {
            left: 15px;
            top: auto;
            bottom: 15px;
            transform: none;
            width: calc(100vw - 30px);
        }

        .card {
            padding: 12px 16px;
            margin-bottom: 10px;
        }

        #steamName {
            font-size: 23px;
        }

        #serverName {
            font-size: 21px;
        }

        #eggMessage {
            font-size: 15px;
        }

        #communityBadge {
            left: 15px;
            top: 15px;
            font-size: 13px;
        }

        #avatar,
        #avatarImage {
            width: 95px;
            height: 95px;
        }
    }
</style>
</head>

<body>

<div id="communityBadge">
    🧸 AUTISM KINDERGARTEN 🧸
</div>

<div id="demoBadge">
    DEMO MODE :D
</div>

<div id="leftSide">

    <div class="card" id="playerCard">
        <div id="welcome">WELCOME TO TROUBLE IN AUTISM TOWN!</div>
        <div id="steamName">GMod Player :D</div>
        <div id="community">AUTISM KINDERGARTEN 🧸</div>
    </div>

    <div class="card" id="serverCard">
        <div id="serverName">Trouble in Autism Town</div>
        <div id="gameMode">🔪 TROUBLE IN TERRORIST TOWN 🔫</div>
        <div id="mapName">MAP: gm_construct</div>
    </div>

    <div class="card" id="statusCard">
        <div id="status">Waiting for the server...</div>

        <div id="loadingBar">
            <div id="loadingProgress"></div>
        </div>
    </div>

    <div class="card" id="easterEgg">
        <div id="eggMessage">
            Checking who is definitely NOT a traitor...
        </div>
    </div>

</div>

<div id="avatar">
    <img id="avatarImage" alt="Steam Avatar">
</div>

<div id="glitch"></div>

<script>
/* ============================================================

   ============================================================ */

const FORCE_DEMO_MODE = false;

const AVATAR_SIZE = 128;

const MIN_SPEED = 1.5;
const MAX_SPEED = 5.5;

const TRAIL_INTERVAL = 12;
const MAX_TRAILS = 24;

const MAX_ANGLE_CHANGE = 0.45;

let demoMode = false;
let gotGameDetails = false;

let posX = window.innerWidth / 2 - AVATAR_SIZE / 2;
let posY = window.innerHeight / 2 - AVATAR_SIZE / 2;

let vx = randomDirection() * randomRange(MIN_SPEED, MAX_SPEED);
let vy = randomDirection() * randomRange(MIN_SPEED, MAX_SPEED);

let rotation = 0;
let rotationVelocity = randomRange(-2, 2);

let trailCounter = 0;

let progress = 0;

/* ============================================================
   ELEMENTS
   ============================================================ */

const avatar = document.getElementById("avatar");
const avatarImage = document.getElementById("avatarImage");

const steamName = document.getElementById("steamName");
const serverName = document.getElementById("serverName");
const gameMode = document.getElementById("gameMode");
const mapName = document.getElementById("mapName");

const statusElement = document.getElementById("status");
const progressElement = document.getElementById("loadingProgress");

const eggMessage = document.getElementById("eggMessage");
const demoBadge = document.getElementById("demoBadge");

/* ============================================================
   HELPERS
   ============================================================ */

function randomRange(min, max) {
    return Math.random() * (max - min) + min;
}

function randomDirection() {
    return Math.random() < 0.5 ? -1 : 1;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

/* ============================================================
   DUMMY AVATAR
   ============================================================ */

function createDummyAvatar() {
    const colors = [
        "#ff006e",
        "#ffea00",
        "#00f5ff",
        "#7cff00",
        "#a855f7",
        "#ff7b00"
    ];

    const color1 = colors[Math.floor(Math.random() * colors.length)];
    const color2 = colors[Math.floor(Math.random() * colors.length)];

    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
            <defs>
                <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="${color1}"/>
                    <stop offset="100%" stop-color="${color2}"/>
                </linearGradient>
            </defs>

            <rect width="256" height="256" fill="url(#g)"/>

            <circle
                cx="128"
                cy="104"
                r="58"
                fill="#ffe0bd"
            />

            <circle
                cx="102"
                cy="100"
                r="9"
                fill="#111"
            />

            <circle
                cx="154"
                cy="100"
                r="9"
                fill="#111"
            />

            <path
                d="M85 135 Q128 175 171 135"
                stroke="#111"
                stroke-width="12"
                fill="none"
                stroke-linecap="round"
            />

            <path
                d="M70 65 Q128 15 186 65"
                stroke="#111"
                stroke-width="25"
                fill="none"
                stroke-linecap="round"
            />

            <text
                x="128"
                y="225"
                text-anchor="middle"
                font-family="Comic Sans MS, Comic Sans, cursive"
                font-size="25"
                font-weight="bold"
                fill="white"
            >:D</text>
        </svg>
    `;

    return "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);
}

/* ============================================================
   STEAM AVATAR
   ============================================================ */

function setDummyAvatar() {
    avatarImage.src = createDummyAvatar();
}

function setRealSteamAvatar(steamID) {
    if (!steamID) {
        setDummyAvatar();
        return;
    }

    const url =
        "https://steamcommunity.com/profiles/" +
        steamID +
        "/avatarfull.jpg";

    avatarImage.onload = function() {
        avatarImage.style.display = "block";
    };

    avatarImage.onerror = function() {
        setDummyAvatar();
    };

    avatarImage.src = url;
}

/* ============================================================
   STEAM NAME
   ============================================================ */

async function getSteamName(steamID) {
    if (!steamID) {
        steamName.textContent = "GMod Player :D";
        return;
    }

    try {
        const response = await fetch(
            "https://steamcommunity.com/profiles/" +
            steamID +
            "?xml=1"
        );

        if (!response.ok) {
            throw new Error("Steam request failed");
        }

        const text = await response.text();

        const match = text.match(
            /<steamID><!\[CDATA\[(.*?)\]\]><\/steamID>/
        );

        if (match && match[1]) {
            steamName.textContent = match[1];
        } else {
            steamName.textContent = "GMod Player :D";
        }

    } catch (error) {
        steamName.textContent = "GMod Player :D";
    }
}

/* ============================================================
   DEMO MODE
   ============================================================ */

function startDemoMode() {
    if (gotGameDetails && !FORCE_DEMO_MODE) {
        return;
    }

    demoMode = true;

    demoBadge.style.display = "block";

    steamName.textContent = "GMod Player :D";

    serverName.textContent =
        "Trouble in Autism Town";

    gameMode.textContent =
        "🔪 TROUBLE IN TERRORIST TOWN 🔫";

    mapName.textContent =
        "MAP: gm_construct";

    statusElement.textContent =
        "Pretending to load... probably.";

    setDummyAvatar();

    setProgress(47);
}

/* ============================================================
   GAMEMODE API
   ============================================================ */

window.GameDetails = function(
    servername,
    serverurl,
    gamemap,
    maxplayers,
    steamid,
    gamemode,
    volume,
    language
) {
    gotGameDetails = true;
    demoMode = false;

    demoBadge.style.display = "none";

    steamName.textContent = "GMod Player :D";

    serverName.textContent =
        servername || "Trouble in Autism Town";

    gameMode.textContent =
        gamemode
            ? "🔪 " + gamemode.toUpperCase() + " 🔫"
            : "🔪 TROUBLE IN TERRORIST TOWN 🔫";

    mapName.textContent =
        "MAP: " + (gamemap || "unknown");

    setRealSteamAvatar(steamid);
    getSteamName(steamid);

    statusElement.textContent =
        "Welcome to Trouble in Autism Town!";

    setProgress(5);
};

/* ============================================================
   STATUS API
   ============================================================ */

window.SetStatusChanged = function(statusText) {
    statusElement.textContent =

    progress += randomRange(3, 10);

    setProgress(progress);
};
