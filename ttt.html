<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #111;
        color: #fff;
    }

    body {
        position: relative;

        background-image:
            linear-gradient(
                rgba(0, 0, 0, 0.45),
                rgba(0, 0, 0, 0.65)
            ),
            url("https://raw.githubusercontent.com/gamerdad24/website/refs/heads/main/images/autism.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    #leftSide {
        position: fixed;
        left: 30px;
        bottom: 28px;
        width: 360px;
        z-index: 20;
    }

    .section {
        margin-bottom: 14px;
    }

    .label {
        margin-bottom: 3px;
        font-size: 9px;
        font-weight: 600;
        color: rgba(255,255,255,0.55);
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }

    #steamName {
        font-size: 21px;
        font-weight: 600;
        color: white;
    }

    #serverName {
        font-size: 18px;
        font-weight: 600;
        color: white;
    }

    #mapName {
        margin-top: 4px;
        font-size: 11px;
        color: rgba(255,255,255,0.65);
    }

    #status {
        min-height: 17px;
        font-size: 11px;
        color: rgba(255,255,255,0.75);
    }

    #loadingBar {
        width: 100%;
        height: 3px;
        margin-top: 8px;
        overflow: hidden;
        background: rgba(255,255,255,0.18);
        border-radius: 3px;
    }

    #loadingProgress {
        width: 0%;
        height: 100%;
        background: white;
        border-radius: 3px;
        transition: width 0.25s ease;
    }

    #eggMessage {
        min-height: 17px;
        font-size: 10px;
        color: rgba(255,255,255,0.45);
        transition: opacity 0.3s ease;
    }

    #avatar,
    #enemy {
        position: fixed;
        width: 125px;
        height: 125px;
        pointer-events: none;
        transform-origin: center center;
    }

    #avatar {
        z-index: 10;
    }

    #enemy {
        z-index: 9;
    }

    #avatarImage,
    #enemyImage {
        width: 125px;
        height: 125px;
        display: block;
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.9);
        box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    #avatarImage {
        animation:
            subtlePulse
            2s
            ease-in-out
            infinite;
    }

    .explosionParticle {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        background: #fff;

        box-shadow:
            0 0 8px
            rgba(255,255,255,0.9);

        transform:
            translate(-50%, -50%);

        will-change:
            transform,
            opacity;

        z-index: 30;
    }

    .explosionFlash {
        position: fixed;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 29;

        background:
            rgba(255,255,255,0.9);

        box-shadow:
            0 0 25px
            rgba(255,255,255,0.8);

        transform:
            translate(-50%, -50%)
            scale(0.5);

        animation:
            flashAnimation
            0.25s
            ease-out
            forwards;
    }

    @keyframes flashAnimation {
        0% {
            opacity: 1;
            transform:
                translate(-50%, -50%)
                scale(0.5);
        }

        100% {
            opacity: 0;
            transform:
                translate(-50%, -50%)
                scale(4);
        }
    }

    #demoBadge {
        display: none;

        position: fixed;
        right: 25px;
        top: 25px;
        z-index: 40;

        padding: 7px 11px;

        border: 1px solid
            rgba(255,255,255,0.3);

        border-radius: 4px;

        background:
            rgba(0,0,0,0.45);

        color:
            rgba(255,255,255,0.65);

        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    @keyframes subtlePulse {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.015);
        }
    }

    @media (max-width: 700px) {

        #leftSide {
            left: 18px;
            right: 18px;
            bottom: 18px;
            width: auto;
        }

        #steamName {
            font-size: 18px;
        }

        #serverName {
            font-size: 16px;
        }

        #avatar,
        #enemy {
            width: 110px;
            height: 110px;
        }

        #avatarImage,
        #enemyImage {
            width: 110px;
            height: 110px;
        }
    }
</style>
</head>

<body>

<div id="leftSide">

    <div class="section">
        <div class="label">Player</div>

        <div id="steamName">
            GMod Player
        </div>
    </div>

    <div class="section">
        <div class="label">Server</div>

        <div id="serverName">
            Garry's Mod Server
        </div>

        <div id="mapName">
            MAP: gm_construct
        </div>
    </div>

    <div class="section">

        <div id="status">
            Waiting for the server...
        </div>

        <div id="loadingBar">
            <div id="loadingProgress"></div>
        </div>

    </div>

    <div id="eggMessage">
        Loading...
    </div>

</div>

<div id="demoBadge">
    Demo Mode
</div>

<div id="avatar">
    <img
        id="avatarImage"
        alt="Steam Avatar"
    >
</div>

<div id="enemy">
    <img
        id="enemyImage"
        alt="Enemy"
    >
</div>

<script>

const FORCE_DEMO_MODE = false;


/* ============================================================
   BALL SETTINGS
   ============================================================ */

const BALL_SIZE = 125;

const AVATAR_SIZE = BALL_SIZE;
const ENEMY_SIZE = BALL_SIZE;

const MIN_SPEED = 1.5;
const MAX_SPEED = 5.5;

const ENEMY_MIN_SPEED = 1.7;
const ENEMY_MAX_SPEED = 5.0;


/* ============================================================
   COLLISION PARTICLES
   ============================================================ */

const EXPLOSION_PARTICLES = 28;


/* ============================================================
   ENEMY IMAGES
   ============================================================ */

const ENEMY_IMAGES = [

    "https://i.pinimg.com/736x/9a/2d/fc/9a2dfce91444f5777adf91953ba36ed7.jpg",

    "https://i1.sndcdn.com/artworks-OhcxKQSwuzGanUDr-19O4tQ-t500x500.jpg",

    "https://images.shoutwiki.com/8chanmania/7/7e/Aleksandr_Pistoletov_Image.png",

    "https://upload.wikimedia.org/wikipedia/en/e/e7/Viper_You%27ll_Cowards_Don%27t_Even_Smoke_Crack.jpg",

    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyoEC963_FyTpdWOsoiwWq3zci4kb-6QkH-8yy1AaLZ3u-MwJu1I4pu9c&s=10"

];


const randomEnemyImage =
    ENEMY_IMAGES[
        Math.floor(
            Math.random() *
            ENEMY_IMAGES.length
        )
    ];


/* ============================================================
   STATE
   ============================================================ */

let gotGameDetails = false;
let progress = 0;

let posX =
    window.innerWidth / 2 -
    AVATAR_SIZE / 2;

let posY =
    window.innerHeight / 2 -
    AVATAR_SIZE / 2;

let vx =
    randomDirection() *
    randomRange(
        MIN_SPEED,
        MAX_SPEED
    );

let vy =
    randomDirection() *
    randomRange(
        MIN_SPEED,
        MAX_SPEED
    );

let enemyX =
    window.innerWidth * 0.72;

let enemyY =
    window.innerHeight * 0.30;

let enemyVX =
    randomDirection() *
    randomRange(
        ENEMY_MIN_SPEED,
        ENEMY_MAX_SPEED
    );

let enemyVY =
    randomDirection() *
    randomRange(
        ENEMY_MIN_SPEED,
        ENEMY_MAX_SPEED
    );

let collisionCooldown = 0;


/* ============================================================
   ELEMENTS
   ============================================================ */

const avatar =
    document.getElementById(
        "avatar"
    );

const avatarImage =
    document.getElementById(
        "avatarImage"
    );

const enemy =
    document.getElementById(
        "enemy"
    );

const enemyImage =
    document.getElementById(
        "enemyImage"
    );

const steamName =
    document.getElementById(
        "steamName"
    );

const serverName =
    document.getElementById(
        "serverName"
    );

const mapName =
    document.getElementById(
        "mapName"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const progressElement =
    document.getElementById(
        "loadingProgress"
    );

const eggMessage =
    document.getElementById(
        "eggMessage"
    );

const demoBadge =
    document.getElementById(
        "demoBadge"
    );


/* ============================================================
   RANDOM ENEMY
   ============================================================ */

enemyImage.src =
    randomEnemyImage;


/* ============================================================
   HELPERS
   ============================================================ */

function randomRange(min, max) {
    return Math.random() *
        (max - min) +
        min;
}


function randomDirection() {
    return Math.random() < 0.5
        ? -1
        : 1;
}


function clamp(value, min, max) {
    return Math.max(
        min,
        Math.min(max, value)
    );
}


/* ============================================================
   DEMO PFP
   ============================================================ */

function createDummyAvatar() {

    const svg = `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="256"
            height="256"
        >

            <rect
                width="256"
                height="256"
                fill="#555"
            />

            <text
                x="128"
                y="140"
                text-anchor="middle"
                font-family="Arial, Helvetica, sans-serif"
                font-size="58"
                font-weight="700"
                fill="#fff"
            >pfp</text>

        </svg>
    `;

    return "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);
}


function setDummyAvatar() {

    avatarImage.src =
        createDummyAvatar();
}


function setRealSteamAvatar(steamID) {

    if (!steamID) {

        setDummyAvatar();

        return;
    }

    const url =
        "https://steamcommunity.com/profiles/" +
        steamID +
        "/avatarfull.jpg";

    avatarImage.onload =
        function() {

            avatarImage.style.display =
                "block";
        };

    avatarImage.onerror =
        function() {

            setDummyAvatar();
        };

    avatarImage.src =
        url;
}


/* ============================================================
   STEAM NAME
   ============================================================ */

async function getSteamName(steamID) {

    if (!steamID) {

        steamName.textContent =
            "GMod Player";

        return;
    }

    try {

        const response =
            await fetch(
                "https://steamcommunity.com/profiles/" +
                steamID +
                "?xml=1"
            );

        if (!response.ok) {

            throw new Error(
                "Steam request failed"
            );
        }

        const text =
            await response.text();

        const match =
            text.match(
                /<steamID><!\[CDATA\[(.*?)\]\]><\/steamID>/
            );

        if (
            match &&
            match[1]
        ) {

            steamName.textContent =
                match[1];

        } else {

            steamName.textContent =
                "GMod Player";
        }

    } catch (error) {

        steamName.textContent =
            "GMod Player";
    }
}


/* ============================================================
   DEMO MODE
   ============================================================ */

function startDemoMode() {

    if (
        gotGameDetails &&
        !FORCE_DEMO_MODE
    ) {
        return;
    }

    demoBadge.style.display =
        "block";

    steamName.textContent =
        "GMod Player";

    serverName.textContent =
        "Example GMod Server";

    mapName.textContent =
        "MAP: gm_construct";

    statusElement.textContent =
        "Demo mode — pretending to load...";

    setDummyAvatar();

    setProgress(45);
}


/* ============================================================
   GARRY'S MOD CALLBACKS
   ============================================================ */

window.GameDetails =
function(
    servername,
    serverurl,
    gamemap,
    maxplayers,
    steamid,
    gamemode,
    volume,
    language
) {

    gotGameDetails = true;

    demoBadge.style.display =
        "none";

    steamName.textContent =
        "GMod Player";

    serverName.textContent =
        servername ||
        "Garry's Mod Server";

    mapName.textContent =
        "MAP: " +
        (
            gamemap ||
            "unknown"
        );

    setRealSteamAvatar(
        steamid
    );

    getSteamName(
        steamid
    );

    statusElement.textContent =
        "Getting things ready...";

    setProgress(5);
};


window.SetStatusChanged =
function(statusText) {

    statusElement.textContent =
        statusText ||
        "Loading...";

    progress +=
        randomRange(3, 10);

    setProgress(progress);
};


window.DownloadingFile =
function(file) {

    statusElement.textContent =
        "Downloading: " +
        (
            file ||
            "file"
        );

    progress +=
        randomRange(0.5, 3);

    setProgress(progress);
};


function setProgress(value) {

    progress =
        clamp(
            value,
            0,
            100
        );

    progressElement.style.width =
        progress + "%";
}


/* ============================================================
   LOADING MESSAGES
   ============================================================ */

const messages = [

    "Loading...",
    "Getting things ready...",
    "Loading game files...",
    "Checking server connection...",
    "Preparing the map...",
    "Loading addons...",
    "Almost there...",
    "Please wait...",
    "Connecting...",
    "Starting server session..."

];


let messageIndex = 0;


function nextMessage() {

    eggMessage.style.opacity =
        "0";

    setTimeout(
        () => {

            eggMessage.textContent =
                messages[
                    messageIndex
                ];

            messageIndex =
                (
                    messageIndex + 1
                ) %
                messages.length;

            eggMessage.style.opacity =
                "1";

        },
        300
    );
}


setInterval(
    nextMessage,
    4000
);


/* ============================================================
   COLLISION EXPLOSION
   ============================================================ */

function createExplosion(
    centerX,
    centerY
) {

    const flash =
        document.createElement(
            "div"
        );

    flash.className =
        "explosionFlash";

    flash.style.left =
        centerX + "px";

    flash.style.top =
        centerY + "px";

    document.body.appendChild(
        flash
    );

    setTimeout(
        () => {

            if (flash.parentNode) {

                flash.parentNode
                    .removeChild(
                        flash
                    );
            }

        },
        300
    );


    for (
        let i = 0;
        i < EXPLOSION_PARTICLES;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "explosionParticle";


        const angle =
            Math.random() *
            Math.PI *
            2;


        let velocity =
            randomRange(
                3,
                10
            );


        let velocityX =
            Math.cos(angle) *
            velocity;


        let velocityY =
            Math.sin(angle) *
            velocity;


        const size =
            randomRange(
                3,
                8
            );


        particle.style.width =
            size + "px";

        particle.style.height =
            size + "px";

        particle.style.left =
            centerX + "px";

        particle.style.top =
            centerY + "px";


        document.body.appendChild(
            particle
        );


        let x = centerX;
        let y = centerY;


        let life =
            randomRange(
                35,
                65
            );


        const gravity =
            0.16;


        function animateParticle() {

            x += velocityX;
            y += velocityY;

            velocityY += gravity;

            velocityX *= 0.985;
            velocityY *= 0.985;

            life--;

            particle.style.left =
                x + "px";

            particle.style.top =
                y + "px";

            particle.style.opacity =
                Math.max(
                    0,
                    life / 65
                );


            if (life > 0) {

                requestAnimationFrame(
                    animateParticle
                );

            } else {

                if (
                    particle.parentNode
                ) {

                    particle.parentNode
                        .removeChild(
                            particle
                        );
                }
            }
        }


        requestAnimationFrame(
            animateParticle
        );
    }
}


/* ============================================================
   PLAYER DIRECTION
   ============================================================ */

function changeDirection(
    horizontal,
    direction
) {

    const speed =
        randomRange(
            MIN_SPEED,
            MAX_SPEED
        );

    const variation =
        randomRange(
            -0.4,
            0.4
        );

    if (horizontal) {

        vx =
            direction *
            speed;

        vy +=
            variation;

    } else {

        vy =
            direction *
            speed;

        vx +=
            variation;
    }
}


/* ============================================================
   ENEMY DIRECTION
   ============================================================ */

function changeEnemyDirection(
    horizontal,
    direction
) {

    const speed =
        randomRange(
            ENEMY_MIN_SPEED,
            ENEMY_MAX_SPEED
        );

    const variation =
        randomRange(
            -0.4,
            0.4
        );

    if (horizontal) {

        enemyVX =
            direction *
            speed;

        enemyVY +=
            variation;

    } else {

        enemyVY =
            direction *
            speed;

        enemyVX +=
            variation;
    }
}


/* ============================================================
   PLAYER / ENEMY COLLISION
   ============================================================ */

function checkPlayerEnemyCollision() {

    if (
        collisionCooldown > 0
    ) {
        return;
    }


    const playerCenterX =
        posX +
        AVATAR_SIZE / 2;

    const playerCenterY =
        posY +
        AVATAR_SIZE / 2;


    const enemyCenterX =
        enemyX +
        ENEMY_SIZE / 2;

    const enemyCenterY =
        enemyY +
        ENEMY_SIZE / 2;


    const dx =
        playerCenterX -
        enemyCenterX;

    const dy =
        playerCenterY -
        enemyCenterY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const collisionDistance =
        BALL_SIZE;


    if (
        distance <=
        collisionDistance
    ) {

        const explosionX =
            (
                playerCenterX +
                enemyCenterX
            ) / 2;


        const explosionY =
            (
                playerCenterY +
                enemyCenterY
            ) / 2;


        createExplosion(
            explosionX,
            explosionY
        );


        let normalX = dx;
        let normalY = dy;


        const length =
            Math.sqrt(
                normalX * normalX +
                normalY * normalY
            );


        if (length > 0) {

            normalX /=
                length;

            normalY /=
                length;

        } else {

            normalX = 1;
            normalY = 0;
        }


        const push = 8;


        posX +=
            normalX *
            push;

        posY +=
            normalY *
            push;


        enemyX -=
            normalX *
            push;

        enemyY -=
            normalY *
            push;


        vx =
            -vx *
            randomRange(
                0.9,
                1.1
            );

        vy =
            -vy *
            randomRange(
                0.9,
                1.1
            );


        enemyVX =
            -enemyVX *
            randomRange(
                0.9,
                1.1
            );

        enemyVY =
            -enemyVY *
            randomRange(
                0.9,
                1.1
            );


        collisionCooldown = 35;
    }
}


/* ============================================================
   PLAYER MOVEMENT
   ============================================================ */

function updatePlayer() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    posX += vx;
    posY += vy;


    if (posX <= 0) {

        posX = 0;

        vx =
            Math.abs(vx);

        changeDirection(
            true,
            1
        );
    }


    if (
        posX +
        AVATAR_SIZE >=
        width
    ) {

        posX =
            width -
            AVATAR_SIZE;

        vx =
            -Math.abs(vx);

        changeDirection(
            true,
            -1
        );
    }


    if (posY <= 0) {

        posY = 0;

        vy =
            Math.abs(vy);

        changeDirection(
            false,
            1
        );
    }


    if (
        posY +
        AVATAR_SIZE >=
        height
    ) {

        posY =
            height -
            AVATAR_SIZE;

        vy =
            -Math.abs(vy);

        changeDirection(
            false,
            -1
        );
    }


    avatar.style.left =
        posX + "px";

    avatar.style.top =
        posY + "px";
}


/* ============================================================
   ENEMY MOVEMENT
   ============================================================ */

function updateEnemy() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    enemyX += enemyVX;
    enemyY += enemyVY;


    if (enemyX <= 0) {

        enemyX = 0;

        enemyVX =
            Math.abs(enemyVX);

        changeEnemyDirection(
            true,
            1
        );
    }


    if (
        enemyX +
        ENEMY_SIZE >=
        width
    ) {

        enemyX =
            width -
            ENEMY_SIZE;

        enemyVX =
            -Math.abs(enemyVX);

        changeEnemyDirection(
            true,
            -1
        );
    }


    if (enemyY <= 0) {

        enemyY = 0;

        enemyVY =
            Math.abs(enemyVY);

        changeEnemyDirection(
            false,
            1
        );
    }


    if (
        enemyY +
        ENEMY_SIZE >=
        height
    ) {

        enemyY =
            height -
            ENEMY_SIZE;

        enemyVY =
            -Math.abs(enemyVY);

        changeEnemyDirection(
            false,
            -1
        );
    }


    enemy.style.left =
        enemyX + "px";

    enemy.style.top =
        enemyY + "px";
}


/* ============================================================
   ANIMATION
   ============================================================ */

function animate() {

    updatePlayer();

    updateEnemy();

    checkPlayerEnemyCollision();


    if (
        collisionCooldown > 0
    ) {

        collisionCooldown--;
    }


    requestAnimationFrame(
        animate
    );
}


/* ============================================================
   RESIZE
   ============================================================ */

window.addEventListener(
    "resize",
    () => {

        posX =
            clamp(
                posX,
                0,
                window.innerWidth -
                AVATAR_SIZE
            );

        posY =
            clamp(
                posY,
                0,
                window.innerHeight -
                AVATAR_SIZE
            );

        enemyX =
            clamp(
                enemyX,
                0,
                window.innerWidth -
                ENEMY_SIZE
            );

        enemyY =
            clamp(
                enemyY,
                0,
                window.innerHeight -
                ENEMY_SIZE
            );
    }
);


/* ============================================================
   START
   ============================================================ */

setDummyAvatar();

setProgress(0);

animate();


setTimeout(
    () => {

        if (
            !gotGameDetails ||
            FORCE_DEMO_MODE
        ) {

            startDemoMode();
        }
