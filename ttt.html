<style>
    * {
        box-sizing: border-box;
        user-select: none;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #111;
        color: #fff;
    }

    body {
        position: relative;

        background-image:
            linear-gradient(

                rgba(0, 0, 0, 0.65)

    #leftSide {

    }

    .section {

    }

    .label {

    #steamName {
        font-size: 21px;
        font-weight: 600;
        color: white;
    }

    #serverName {
        font-size: 18px;

    }

    #status {

        font-size: 11px;
        color: rgba(255,255,255,0.75);
    }

    #loadingBar {
        width: 100%;
        height: 3px;
        margin-top: 8px;
        overflow: hidden;
        background: rgba(255,255,255,0.18);
        border-radius: 3px;
    }

    #loadingProgress {
        width: 0%;
        height: 100%;
        background: white;
        border-radius: 3px;
        transition: width 0.25s ease;
    }

    #eggMessage {
        min-height: 17px;
        font-size: 10px;
        color: rgba(255,255,255,0.45);
        transition: opacity 0.3s ease;
    }

    #avatar,
    #enemy {
        position: fixed;
        width: 125px;
        height: 125px;
        pointer-events: none;
        transform-origin: center center;
    }

    #avatar {
        z-index: 10;
    }

    #enemy {
        z-index: 9;
    }

    #avatarImage,
    #enemyImage {
        width: 125px;
        height: 125px;
        display: block;
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.9);
        box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    #avatarImage {
        animation:
            subtlePulse
            2s
            ease-in-out
            infinite;
    }

    .explosionParticle {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        background: #fff;

        box-shadow:
            0 0 8px
            rgba(255,255,255,0.9);

        transform:
            translate(-50%, -50%);

        will-change:
            transform,
            opacity;

        z-index: 30;
    }

    .explosionFlash {
        position: fixed;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 29;

        background:
            rgba(255,255,255,0.9);

        box-shadow:
            0 0 25px
            rgba(255,255,255,0.8);

        transform:
            translate(-50%, -50%)
            scale(0.5);

        animation:
            flashAnimation
            0.25s
            ease-out
            forwards;
    }

    @keyframes flashAnimation {
        0% {
            opacity: 1;
            transform:
                translate(-50%, -50%)
                scale(0.5);
        }

        100% {
            opacity: 0;
            transform:
                translate(-50%, -50%)
                scale(4);
        }
    }

    #demoBadge {
        display: none;

        position: fixed;
        right: 25px;
        top: 25px;
        z-index: 40;

        padding: 7px 11px;

        border: 1px solid
            rgba(255,255,255,0.3);

        border-radius: 4px;

        background:
            rgba(0,0,0,0.45);

        color:
            rgba(255,255,255,0.65);

        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    @keyframes subtlePulse {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.015);
        }
    }

    @media (max-width: 700px) {

        #leftSide {
            left: 18px;
            right: 18px;
            bottom: 18px;
            width: auto;
        }

        #steamName {
            font-size: 18px;
        }

        #serverName {
            font-size: 16px;
        }

        #avatar,
        #enemy {
            width: 110px;
            height: 110px;
        }

        #avatarImage,
        #enemyImage {
            width: 110px;
            height: 110px;
        }
    }
</style>

<script>

const FORCE_DEMO_MODE = false;


/*

const BALL_SIZE = 125;

const AVATAR_SIZE = BALL_SIZE;

/*

*/

const MIN_SPEED = 1.5;
const MAX_SPEED = 5.5;


/*
    ENEMY SPEED
*/

const ENEMY_MIN_SPEED = 1.7;
const ENEMY_MAX_SPEED = 5.0;


/*
    COLLISION PARTICLES
*/

const EXPLOSION_PARTICLES = 28;


/*
    ENEMY IMAGES
*/

const ENEMY_IMAGES = [

    "https://i.pinimg.com/736x/9a/2d/fc/9a2dfce91444f5777adf91953ba36ed7.jpg",

    "https://i1.sndcdn.com/artworks-OhcxKQSwuzGanUDr-19O4tQ-t500x500.jpg",

    "https://images.shoutwiki.com/8chanmania/7/7e/Aleksandr_Pistoletov_Image.png",

    "https://upload.wikimedia.org/wikipedia/en/e/e7/Viper_You%27ll_Cowards_Don%27t_Even_Smoke_Crack.jpg",

    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyoEC963_FyTpdWOsoiwWq3zci4kb-6QkH-8yy1AaLZ3u-MwJu1I4pu9c&s=10"

];


const randomEnemyImage =
    ENEMY_IMAGES[
        Math.floor(
            Math.random() *
            ENEMY_IMAGES.length
        )
    ];


/*
    STATE
*/

let gotGameDetails = false;

let progress = 0;

let playerSteamID = null;


/*
    PLAYER POSITION
*/

let posX =
    window.innerWidth / 2 -
    AVATAR_SIZE / 2;

let posY =
    window.innerHeight / 2 -
    AVATAR_SIZE / 2;


/*
    PLAYER VELOCITY
*/

let vx =
    randomDirection() *
    randomRange(
        MIN_SPEED,
        MAX_SPEED
    );

let vy =

    randomRange(
        MIN_SPEED,
        MAX_SPEED
    );


/*
    ENEMY POSITION
*/

let enemyX =
    window.innerWidth * 0.72;

let enemyY =
    window.innerHeight * 0.30;


/*
    ENEMY VELOCITY
*/

let enemyVX =
    randomDirection() *
    randomRange(
        ENEMY_MIN_SPEED,
        ENEMY_MAX_SPEED
    );

let enemyVY =
    randomDirection() *
    randomRange(
        ENEMY_MIN_SPEED,
        ENEMY_MAX_SPEED
    );


let collisionCooldown = 0;


/*
    ELEMENTS
*/

const avatar =
    document.getElementById(
        "avatar"
    );

const avatarImage =
    document.getElementById(
        "avatarImage"
    );

const enemy =
    document.getElementById(
        "enemy"
    );

const enemyImage =
    document.getElementById(
        "enemyImage"
    );

const steamName =
    document.getElementById(
        "steamName"
    );

const serverName =
    document.getElementById(
        "serverName"
    );

const mapName =
    document.getElementById(
        "mapName"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const progressElement =
    document.getElementById(
        "loadingProgress"
    );

const eggMessage =
    document.getElementById(
        "eggMessage"
    );

const demoBadge =
    document.getElementById(
        "demoBadge"
    );


/*
    ENEMY IMAGE
*/

enemyImage.src =
    randomEnemyImage;


/*
    HELPERS
*/

function randomRange(
    min,
    max
) {

    return Math.random() *
        (max - min) +
        min;

}


function randomDirection() {

    return Math.random() < 0.5
        ? -1
        : 1;

}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


/*
    FALLBACK PFP
*/

function createDummyAvatar() {

    const svg = `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="256"
            height="256"
        >

            <rect
                width="256"
                height="256"
                fill="#555"
            />

            <text
                x="128"
                y="140"
                text-anchor="middle"
                font-family="Arial, Helvetica, sans-serif"
                font-size="58"
                font-weight="700"
                fill="#fff"
            >pfp</text>

        </svg>
    `;

    return "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

}


function setDummyAvatar() {

    avatarImage.src =
        createDummyAvatar();

}


/*
    GET STEAM ID FROM URL

    Your server.cfg should be:

    sv_loadingurl "https://swib.by/ttt?steamid=%s"

    GMod replaces %s with the
    joining player's SteamID64.
*/

function getSteamIDFromURL() {

    try {

        const params =
            new URLSearchParams(
                window.location.search
            );


        return (
            params.get("steamid") ||
            params.get("SteamId") ||
            params.get("steamID")
        );

    } catch (
        error
    ) {

        return null;

    }

}


/*
    LOAD STEAM PROFILE
*/

async function loadSteamProfile(
    steamID
) {

    if (
        !steamID ||
        steamID === "BOT" ||
        steamID === "0"
    ) {

        setDummyAvatar();

        steamName.textContent =
            "GMod Player";

        return;

    }


    playerSteamID =
        String(steamID);


    try {

        statusElement.textContent =
            "Loading Steam profile...";


        /*
            Public profile API.

            No Steam API key is placed
            in the HTML.
        */

        const apiURL =
            "https://steamgpt.net/profile/" +
            encodeURIComponent(
                playerSteamID
            ) +
            ".json";


        const response =
            await fetch(
                apiURL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Profile request failed"
            );

        }


        const result =
            await response.json();


        if (
            !result ||
            result.result !== "success" ||
            !result.data
        ) {

            throw new Error(
                "Invalid profile response"
            );

        }


        const profile =
            result.data.steam;


        if (
            !profile
        ) {

            throw new Error(
                "No Steam profile"
            );

        }


        /*
            REAL STEAM NAME
        */

        const name =
            profile.personaname ||
            profile.player_name;


        if (
            name &&
            name.trim()
        ) {

            steamName.textContent =
                name.trim();

        }


        /*
            REAL STEAM AVATAR
        */

        const avatarURL =
            profile.avatarfull ||
            profile.avatarmedium ||
            profile.avatar;


        if (
            avatarURL
        ) {

            avatarImage.onerror =
                function() {

                    setDummyAvatar();

                };


            avatarImage.src =
                avatarURL;

        } else {

            setDummyAvatar();

        }


    } catch (
        error
    ) {

        console.error(
            "Steam profile error:",
            error
        );


        /*
            Keep the loading screen
            working if the external
            profile service fails.
        */

        if (
            steamName.textContent ===
            "Loading Steam profile..."
        ) {

            steamName.textContent =
                "GMod Player";

        }


        setDummyAvatar();

    }

}


/*
    DEMO MODE
*/

function startDemoMode() {

    if (
        gotGameDetails &&
        !FORCE_DEMO_MODE
    ) {

        return;

    }


    demoBadge.style.display =
        "block";


    steamName.textContent =
        "GMod Player";


    serverName.textContent =
        "Example GMod Server";


    mapName.textContent =
        "MAP: gm_construct";


    statusElement.textContent =
        "Demo mode — pretending to load...";


    setDummyAvatar();


    setProgress(45);

}


/*
    GARRY'S MOD CALLBACK

    GMod calls this when the
    loading screen starts.

    The fifth argument is the
    local player's SteamID64.
*/

window.GameDetails =
function(
    servername,
    serverurl,
    gamemap,
    maxplayers,
    steamid,
    gamemode,
    volume,
    language
) {

    gotGameDetails =
        true;


    demoBadge.style.display =
        "none";


    /*
        Store SteamID64.
    */

    playerSteamID =
        steamid ?
        String(steamid) :
        null;


    /*
        Server information.
    */

    serverName.textContent =
        servername ||
        "Garry's Mod Server";


    mapName.textContent =
        "MAP: " +
        (
            gamemap ||
            "unknown"
        );


    statusElement.textContent =
        "Getting things ready...";


    setProgress(5);


    /*
        Load actual player.
    */

    loadSteamProfile(
        playerSteamID
    );

};


/*
    STATUS CALLBACK
*/

window.SetStatusChanged =
function(
    statusText
) {

    statusElement.textContent =
        statusText ||
        "Loading...";


    progress +=
        randomRange(
            3,
            10
        );


    setProgress(
        progress
    );

};


/*
    DOWNLOADING CALLBACK
*/

window.DownloadingFile =
function(
    file
) {

    statusElement.textContent =
        "Downloading: " +
        (
            file ||
            "file"
        );


    progress +=
        randomRange(
            0.5,
            3
        );


    setProgress(
        progress
    );

};


/*
    PROGRESS
*/

function setProgress(
    value
) {

    progress =
        clamp(
            value,
            0,
            100
        );


    progressElement.style.width =
        progress + "%";

}


/*
    LOADING MESSAGES
*/

const messages = [

    "Loading...",
    "Getting things ready...",
    "Loading game files...",
    "Checking server connection...",
    "Preparing the map...",
    "Loading addons...",
    "Almost there...",
    "Please wait...",
    "Connecting...",
    "Starting server session..."

];


let messageIndex = 0;


function nextMessage() {

    eggMessage.style.opacity =
        "0";


    setTimeout(
        () => {

            eggMessage.textContent =
                messages[
                    messageIndex
                ];


            messageIndex =
                (
                    messageIndex + 1
                ) %
                messages.length;


            eggMessage.style.opacity =
                "1";

        },
        300
    );

}


setInterval(
    nextMessage,
    4000
);

    COLLISION EXPLOSION
*/

    centerY
) {

        );

    flas
