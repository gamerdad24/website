  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const artworkImages = document.querySelectorAll(".artwork img");

    document.querySelectorAll(".artwork.spoiler").forEach((spoiler) => {
      const warning = spoiler.querySelector(".spoiler-warning");

      warning.addEventListener("click", (event) => {
        event.stopPropagation();
        spoiler.classList.add("revealed");
      });
    });

    artworkImages.forEach((image) => {
      image.addEventListener("click", () => {
        const spoiler = image.closest(".artwork.spoiler");

        if (
          spoiler &&
          !spoiler.classList.contains("revealed")
        ) {
          return;
        }

        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;

        lightbox.classList.add("active");
        document.body.classList.add("lightbox-open");
      });
    });

    function closeLightbox() {
      lightbox.classList.remove("active");
      document.body.classList.remove("lightbox-open");

      setTimeout(() => {
        if (!lightbox.classList.contains("active")) {
          lightboxImage.src = "";
          lightboxImage.alt = "";
        }
      }, 200);
    }

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (
        event.key === "Escape" &&
        lightbox.classList.contains("active")
      ) {
        closeLightbox();
      }
    });

    async function imageHasTransparency(image) {
      try {
        if (!image.complete) {
          await new Promise((resolve) => {
            image.addEventListener("load", resolve, { once: true });
            image.addEventListener("error", resolve, { once: true });
          });
        }

        if (!image.naturalWidth || !image.naturalHeight) {
          return false;
        }

        const maxSize = 160;

        let width = image.naturalWidth;
        let height = image.naturalHeight;

        const scale = Math.min(
          1,
          maxSize / width,
          maxSize / height
        );

        width = Math.max(
          1,
          Math.round(width * scale)
        );

        height = Math.max(
          1,
          Math.round(height * scale)
        );

        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const context = canvas.getContext(
          "2d",
          { willReadFrequently: true }
        );

        context.clearRect(
          0,
          0,
          width,
          height
        );

        context.drawImage(
          image,
          0,
          0,
          width,
          height
        );

        const pixels = context.getImageData(
          0,
          0,
          width,
          height
        ).data;

        for (let i = 3; i < pixels.length; i += 4) {
          if (pixels[i] < 250) {
            return true;
          }
        }

        return false;

      } catch (error) {
        return false;
      }
    }

    async function sortTransparentArtwork() {
      const groups = document.querySelectorAll(
        '.gallery-group[data-sort-transparent="true"]'
      );

      for (const group of groups) {
        const items = Array.from(
          group.querySelectorAll(":scope > .gallery-item")
        );

        const opaque = [];
        const transparent = [];
        const handled = new Set();

        for (const item of items) {
          if (handled.has(item)) {
            continue;
          }

          const pairName = item.dataset.pair;

          if (pairName) {
            const pair = items.filter(
              (candidate) =>
                candidate.dataset.pair === pairName
            );

            pair.forEach((candidate) => {
              handled.add(candidate);
            });

            let pairIsTransparent = false;

            for (const pairItem of pair) {
              const pairImage = pairItem.querySelector(".artwork img");

              if (
                pairImage &&
                await imageHasTransparency(pairImage)
              ) {
                pairIsTransparent = true;
              }
            }

            if (pairIsTransparent) {
              transparent.push(...pair);
            } else {
              opaque.push(...pair);
            }

            continue;
          }

          handled.add(item);

          const image = item.querySelector(".artwork img");

          const isTransparent =
            image &&
            await imageHasTransparency(image);

          if (isTransparent) {
            transparent.push(item);
          } else {
            opaque.push(item);
          }
        }

        [
          ...opaque,
          ...transparent
        ].forEach((item) => {
          group.appendChild(item);
        });
      }

      const notice = document.getElementById("gallery-note");

      const firstInfo = document.querySelector(
        ".gallery .gallery-item .info"
      );

      if (
        notice &&
        firstInfo &&
        notice.parentElement !== firstInfo
      ) {
        firstInfo.prepend(notice);
      }
    }

    window.addEventListener("load", () => {
      sortTransparentArtwork();
    });
  </script>


  <!-- MOUSE SPARKLES -->
  <script type="text/javascript">

    var colour="#AAAAAA";
    var sparkles=20;

    var mouseSpeed=0;
    var lastMouseX=400;
    var lastMouseY=300;
    var sparkleSpeedThreshold=4;

    var x=ox=400;
    var y=oy=300;
    var swide=800;
    var shigh=600;
    var sleft=sdown=0;
    var tiny=new Array();
    var star=new Array();
    var starv=new Array();
    var starx=new Array();
    var stary=new Array();
    var tinyx=new Array();
    var tinyy=new Array();
    var tinyv=new Array();

    window.onload=function() { if (document.getElementById) {

      var i, rats, rlef, rdow;

      for (var i=0; i<sparkles; i++) {

        var rats=createDiv(3, 3);

        rats.style.visibility="hidden";

        document.body.appendChild(tiny[i]=rats);

        starv[i]=0;
        tinyv[i]=0;

        var rats=createDiv(5, 5);

        rats.style.backgroundColor="transparent";
        rats.style.visibility="hidden";

        var rlef=createDiv(1, 5);
        var rdow=createDiv(5, 1);

        rats.appendChild(rlef);
        rats.appendChild(rdow);

        rlef.style.top="2px";
        rlef.style.left="0px";

        rdow.style.top="0px";
        rdow.style.left="2px";

        document.body.appendChild(star[i]=rats);

      }

      set_width();
      sparkle();

    }}

    function sparkle() {

      var c;

      if ((x!=ox || y!=oy) && mouseSpeed>=sparkleSpeedThreshold) {

        ox=x;
        oy=y;

        for (c=0; c<sparkles; c++) if (!starv[c]) {

          var offsetX=Math.random()*30-15;
          var offsetY=Math.random()*30-15;

          star[c].style.left=(starx[c]=x+offsetX)+"px";
          star[c].style.top=(stary[c]=y+offsetY)+"px";

          star[c].style.clip="rect(0px, 5px, 5px, 0px)";
          star[c].style.visibility="visible";

          starv[c]=15;

          break;

        }

      }

      for (c=0; c<sparkles; c++) {

        if (starv[c]) update_star(c);
        if (tinyv[c]) update_tiny(c);

      }

      setTimeout("sparkle()", 20);

    }

    function update_star(i) {

      if (--starv[i]==7) {

        star[i].style.clip="rect(1px, 4px, 4px, 1px)";

      }

      if (starv[i]) {

        stary[i]+=1+Math.random()*3;

        if (stary[i]<shigh+sdown) {

          star[i].style.top=stary[i]+"px";

          starx[i]+=(i%7-3)/3.5;

          star[i].style.left=starx[i]+"px";

        }

        else {

          star[i].style.visibility="hidden";
          starv[i]=0;

          return;

        }

      }

      else {

        tinyv[i]=15;

        tiny[i].style.top=(tinyy[i]=stary[i])+"px";
        tiny[i].style.left=(tinyx[i]=starx[i])+"px";

        tiny[i].style.width="2px";
        tiny[i].style.height="2px";

        star[i].style.visibility="hidden";
        tiny[i].style.visibility="visible";

      }

    }

    function update_tiny(i) {

      if (--tinyv[i]==7) {

        tiny[i].style.width="1px";
        tiny[i].style.height="1px";

      }

      if (tinyv[i]) {

        tinyy[i]+=1+Math.random()*3;

        if (tinyy[i]<shigh+sdown) {

          tiny[i].style.top=tinyy[i]+"px";

          tinyx[i]+=(i%7-3)/3.5;

          tiny[i].style.left=tinyx[i]+"px";

        }

        else {

          tiny[i].style.visibility="hidden";
          tinyv[i]=0;

          return;

        }

      }

      else {

        tiny[i].style.visibility="hidden";

      }

    }

    document.onmousemove=mouse;

    function mouse(e) {

      set_scroll();

      var newY=(e)?e.pageY:event.y+sdown;
      var newX=(e)?e.pageX:event.x+sleft;

      var deltaX=newX-lastMouseX;
      var deltaY=newY-lastMouseY;

      mouseSpeed=Math.sqrt(
        deltaX*deltaX +
        deltaY*deltaY
      );

      lastMouseX=newX;
      lastMouseY=newY;

      x=newX;
      y=newY;

    }

    function set_scroll() {

      if (typeof(self.pageYOffset)=="number") {

        sdown=self.pageYOffset;
        sleft=self.pageXOffset;

      }

      else if (document.body.scrollTop || document.body.scrollLeft) {

        sdown=document.body.scrollTop;
        sleft=document.body.scrollLeft;

      }

      else if (
        document.documentElement &&
        (
          document.documentElement.scrollTop ||
          document.documentElement.scrollLeft
        )
      ) {

        sleft=document.documentElement.scrollLeft;
        sdown=document.documentElement.scrollTop;

      }

      else {

        sdown=0;
        sleft=0;

      }

    }

    window.onresize=set_width;

    function set_width() {

      if (typeof(self.innerWidth)=="number") {

        swide=self.innerWidth;
        shigh=self.innerHeight;

      }

      else if (
        document.documentElement &&
        document.documentElement.clientWidth
      ) {

        swide=document.documentElement.clientWidth;
        shigh=document.documentElement.clientHeight;

      }

      else if (document.body.clientWidth) {

        swide=document.body.clientWidth;
        shigh=document.body.clientHeight;

      }

    }

    function createDiv(height, width) {

      var div=document.createElement("div");

      div.style.position="absolute";
      div.style.height=height+"px";
      div.style.width=width+"px";
      div.style.overflow="hidden";
      div.style.backgroundColor=colour;

      div.style.pointerEvents="none";
      div.style.zIndex="9999";

      return div;

    }

  </script>
