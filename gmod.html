```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #bgvideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: fill;
            background: black;
        }
    </style>
</head>

<body>

    <video
        id="bgvideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="funnygoat.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("bgvideo");

        video.muted = true;
        video.volume = 0;

        function startVideo() {
            video.play().catch(function(error) {
                console.log("Video autoplay failed:", error);
            });
        }

        window.addEventListener("load", startVideo);
        video.addEventListener("canplay", startVideo);

        video.addEventListener("ended", function() {
            video.currentTime = 0;
            startVideo();
        });
    </script>

</body>
</html>
